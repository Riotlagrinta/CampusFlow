name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Variables FACTICES : le build et les tests n'appellent aucun service externe et ne
    # touchent à aucune base. Ne jamais mettre de vrais secrets ici.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ADMIN_WHATSAPP: "22800000000"
      GROQ_API_KEY: ci-dummy
      GOOGLE_API_KEY: ci-dummy
      TAVILY_API_KEY: ci-dummy
      GENIUS_PAY_PUBLIC_KEY: ci-dummy
      GENIUS_PAY_SECRET_KEY: ci-dummy
      WHATSAPP_INSTANCE_ID: ci-dummy
      WHATSAPP_TOKEN: ci-dummy
      ADMIN_WHATSAPP_PHONE: "22800000000"
      ADMIN_NOTIFICATION_EMAIL: ci@example.com
      GMAIL_USER: ci@example.com
      GMAIL_APP_PASSWORD: ci-dummy
      BLOB_READ_WRITE_TOKEN: ci-dummy

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le postinstall lance déjà `prisma generate` ; ce dernier n'a pas besoin d'une base joignable.
      - name: Installer les dépendances
        run: npm ci

      - name: Valider le schéma Prisma
        run: npx prisma validate

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Périmètre web uniquement : mobile/ (Expo) a sa propre configuration ESLint et son propre `npm install`.
      - name: Lint
        run: npx eslint src scripts prisma auth.ts next.config.ts vitest.config.ts

      - name: Tests unitaires
        run: npx vitest run

      - name: Cache de build Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npx next build --webpack
